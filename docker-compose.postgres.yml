services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wardapp
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: warddb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardapp -d warddb"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

