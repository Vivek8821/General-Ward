name: Postgres CI

on:
  pull_request:
  push:
    # Run on all branch pushes by default.

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ward
          POSTGRES_PASSWORD: ward
          POSTGRES_DB: ward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ward -d ward_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: ward-backend
        run: npm ci

      - name: Apply Postgres migrations
        working-directory: ward-backend
        env:
          DATABASE_URL: postgres://ward:ward@localhost:5432/ward_test
        run: node ./migratePostgres.js

      - name: Run Postgres smoke test
        working-directory: ward-backend
        env:
          DATABASE_URL: postgres://ward:ward@localhost:5432/ward_test
        run: npx jest tests/services/postgresSmoke.test.js --runInBand --forceExit

