name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security-audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Backend Audit
        working-directory: ward-backend
        run: npm audit --audit-level=high

      - name: Frontend Audit
        working-directory: ward-frontend
        run: npm audit --audit-level=high

  backend-tests:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: ward-backend
        run: npm ci

      - name: Run backend tests
        working-directory: ward-backend
        run: npm test

  frontend-qa:
    name: Frontend Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: ward-frontend
        run: npm ci

      - name: Lint
        working-directory: ward-frontend
        run: npm run lint

      - name: Run Frontend Tests
        working-directory: ward-frontend
        run: npm test

      - name: Build
        working-directory: ward-frontend
        run: npm run build
